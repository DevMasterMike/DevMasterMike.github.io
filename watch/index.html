<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Modern IPTV</title>
  <meta name="description" content="Open this in Modern IPTV to watch it on the TV service you already have.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Modern IPTV">
  <meta property="og:title" content="Modern IPTV">
  <meta property="og:description" content="Open this in Modern IPTV to watch it on the TV service you already have.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#120f3a">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      --text: #ffffff;
      --text-2: rgba(255, 255, 255, 0.72);
      --text-3: rgba(255, 255, 255, 0.52);
      --glass: rgba(255, 255, 255, 0.09);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --stroke: rgba(255, 255, 255, 0.18);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      font-family: var(--font);
      color: var(--text);
      background-color: #120f3a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Fixed gradient layer (avoids background-attachment: fixed issues on iOS). */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(60% 50% at 12% 8%, rgba(46, 132, 255, 0.55) 0%, rgba(46, 132, 255, 0) 70%),
        radial-gradient(55% 45% at 92% 18%, rgba(191, 64, 255, 0.45) 0%, rgba(191, 64, 255, 0) 70%),
        radial-gradient(70% 55% at 80% 100%, rgba(255, 70, 160, 0.30) 0%, rgba(255, 70, 160, 0) 70%),
        radial-gradient(60% 50% at 0% 100%, rgba(40, 200, 255, 0.22) 0%, rgba(40, 200, 255, 0) 70%),
        linear-gradient(160deg, #081a52 0%, #16155a 45%, #3a1670 100%);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 28px 28px;
      border-radius: 32px;
      background: var(--glass);
      border: 1px solid var(--stroke);
      box-shadow:
        0 30px 80px rgba(4, 6, 30, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      -webkit-backdrop-filter: blur(40px) saturate(170%);
      backdrop-filter: blur(40px) saturate(170%);
      text-align: center;
      animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .app-mark {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #1E2A78 0%, #0A85FF 100%);
      box-shadow:
        0 12px 30px rgba(10, 60, 200, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .app-mark svg { width: 100%; height: 100%; display: block; }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-2);
    }

    .kind {
      display: inline-block;
      margin: 0 0 12px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--glass-strong);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-2);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 7.5vw, 36px);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.025em;
      overflow-wrap: anywhere;
    }

    h1 .year {
      font-weight: 500;
      color: var(--text-3);
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 17px;
      line-height: 1.4;
      color: var(--text-2);
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 54px;
      padding: 14px 24px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .button:active { transform: scale(0.97); }

    .button:focus-visible {
      outline: 3px solid rgba(120, 180, 255, 0.9);
      outline-offset: 3px;
    }

    .button-primary {
      background: #ffffff;
      color: #0b0b1a;
      box-shadow: 0 10px 30px rgba(0, 0, 20, 0.35);
    }

    .button-primary:hover { background: #f1f1f6; }

    .button-primary svg { width: 14px; height: 14px; }

    .button-secondary {
      background: var(--glass-strong);
      color: var(--text);
      border: 1px solid var(--stroke);
    }

    .button-secondary:hover { background: rgba(255, 255, 255, 0.2); }

    .download {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .download-label {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-3);
    }

    .coming-soon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px dashed rgba(255, 255, 255, 0.28);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .coming-soon .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5ac8fa;
      box-shadow: 0 0 10px rgba(90, 200, 250, 0.9);
      flex: none;
    }

    .explainer {
      margin: 22px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-3);
    }

    @media (min-width: 700px) {
      .card { padding: 44px 40px 32px; border-radius: 36px; }
      .app-mark { width: 88px; height: 88px; border-radius: 21px; }
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="app-mark" aria-hidden="true">
        <svg viewBox="0 0 1024 1024">
          <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="38">
            <path d="M747.4 367.4 A225 225 0 0 1 747.4 656.6" stroke-opacity="0.4"/>
            <path d="M816.3 309.5 A315 315 0 0 1 816.3 714.5" stroke-opacity="0.26"/>
            <path d="M885.2 251.7 A405 405 0 0 1 885.2 772.3" stroke-opacity="0.14"/>
          </g>
          <path d="M318 318 L706 512 L318 706 Z" fill="#ffffff" stroke="#ffffff" stroke-width="96" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-name">Modern IPTV</div>
    </div>

    <p class="kind" id="kind" hidden></p>
    <h1 id="heading">Something was shared with you</h1>
    <p class="subtitle" id="subtitle">Open it in Modern IPTV to start watching.</p>

    <a class="button button-primary" id="open-app" href="modern-iptv://watch">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M7 4.9v14.2a1.6 1.6 0 0 0 2.4 1.38l12-7.1a1.6 1.6 0 0 0 0-2.76l-12-7.1A1.6 1.6 0 0 0 7 4.9z"/>
      </svg>
      Open in Modern IPTV
    </a>

    <section class="download" aria-label="Get the app">
      <p class="download-label">Don’t have the app yet?</p>
      <div class="coming-soon" id="coming-soon">
        <span class="dot" aria-hidden="true"></span>
        Coming soon to the App Store
      </div>
      <a class="button button-secondary" id="get-app" href="#" hidden>Get Modern IPTV on the App Store</a>
    </section>

    <p class="explainer">Modern IPTV plays the TV service you already have. It finds this same title on your own service.</p>
  </main>

  <script>
    (function () {
      "use strict";

      // Set this to the App Store listing URL once the app is live.
      // While it is empty, the page shows "Coming soon to the App Store".
      var APP_STORE_URL = "";

      var KINDS = { movie: "Movie", show: "TV Show", channel: "Live Channel" };
      var MAX_TITLE_LENGTH = 200;

      var query = new URLSearchParams(window.location.search);

      function clean(value) {
        if (typeof value !== "string") return "";
        // Drop control characters and collapse whitespace.
        var out = "";
        for (var i = 0; i < value.length; i++) {
          var code = value.charCodeAt(i);
          out += (code < 32 || code === 127) ? " " : value.charAt(i);
        }
        return out.replace(/\s+/g, " ").trim();
      }

      var type = clean(query.get("type")).toLowerCase();
      var title = clean(query.get("title"));
      var year = clean(query.get("year"));

      if (!Object.prototype.hasOwnProperty.call(KINDS, type)) type = "";
      if (title.length > MAX_TITLE_LENGTH) title = title.slice(0, MAX_TITLE_LENGTH).trim() + "…";
      if (!/^\d{4}$/.test(year)) year = "";

      // Rebuild the app deep link from the same query items.
      // encodeURIComponent writes spaces as %20; URLSearchParams would write "+", which the app reads literally.
      var appParts = [];
      if (type) appParts.push("type=" + encodeURIComponent(type));
      if (title) appParts.push("title=" + encodeURIComponent(clean(query.get("title"))));
      if (title && year) appParts.push("year=" + encodeURIComponent(year));
      var appQuery = appParts.join("&");
      document.getElementById("open-app").href = "modern-iptv://watch" + (appQuery ? "?" + appQuery : "");

      if (title) {
        var heading = document.getElementById("heading");
        heading.textContent = title;
        if (year) {
          var yearSpan = document.createElement("span");
          yearSpan.className = "year";
          yearSpan.textContent = " (" + year + ")";
          heading.appendChild(yearSpan);
        }

        var kind = document.getElementById("kind");
        if (type) {
          kind.textContent = KINDS[type];
          kind.hidden = false;
        }

        document.getElementById("subtitle").textContent = "Someone shared this with you.";
      }

      // Download area: real button once the App Store URL exists, otherwise "coming soon".
      if (APP_STORE_URL) {
        var getApp = document.getElementById("get-app");
        getApp.href = APP_STORE_URL;
        getApp.hidden = false;
        document.getElementById("coming-soon").hidden = true;
      }
    })();
  </script>
</body>
</html>
